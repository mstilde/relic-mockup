name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Verificar tienda
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Ejecutar tests de catálogo
        run: npm run test

      - name: Compilar producción
        run: npm run build
